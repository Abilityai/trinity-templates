# Trinity agent-template registry
#
# Trinity installs read this file at runtime to decide which GitHub repos the
# Library offers as agent templates (abilityai/trinity#TMPL-002,
# trinity-enterprise#14). Editing this file changes every install's catalog on
# the next fetch — no Trinity release required.
#
# Schema (enforced by src/backend/services/template_registry_service.py):
#   version   int, must be 1
#   templates list, max 25 entries
#     repo          REQUIRED  "owner/name", ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$
#     display_name  optional  <= 200 chars
#     description   optional  <= 1000 chars
#
# No other key is read. A registry entry CANNOT assert `fork_to_own`,
# `credentials`, `schedules`, `hidden` or `id` — those come only from the
# listed repo's own template.yaml, which is the trust boundary. Listing a repo
# here is a recommendation, not a warranty: Trinity clones and trusts that
# repo's template.yaml, so only list repos you control or have reviewed.
#
# Every listed repo MUST be public and anonymously cloneable — Trinity's
# tokenless clone path (trinity-enterprise#123) is what lets a fresh install
# create these agents with no GitHub PAT.

version: 1

templates:
  - repo: Abilityai/cornelius
    display_name: "Cornelius — Second Brain"
    description: >-
      AI insight harvester and second-brain partner over an Obsidian knowledge
      base. Captures original thinking, discovers non-obvious connections
      between notes, runs deep-research pipelines, and grounds advice in what
      you already know.

  - repo: Abilityai/agent-builder
    display_name: "Agent Builder"
    description: >-
      Creates new agents on your instance from a one-paragraph brief. Runs the
      Ability.ai create-agent wizard headlessly, asks you once for anything the
      brief leaves open and once for approval, then creates the agent with every
      schedule off until you review it. No credentials needed; optionally gets a
      design from an advisor agent first.

  # Keymaker agency starter set - a fictional automation agency built in public during the
  # Agent-Native Agency workshop series (keymaker.agency). Zero-credential; file-backed by
  # default; one optional credential each connects the real system (CRM, projects).
  - repo: Abilityai/keymaker-sales
    display_name: "Keymaker Sales"
    description: >-
      The sales desk of a Trinity-powered automation agency. Runs deals on a real
      pipeline with fixed stages, several owners at once, drafts every email for a
      human to send, and asks the operator before a price moves off the list.
      File-backed by default; add a Fibery token for a live CRM.
  - repo: Abilityai/keymaker-delivery
    display_name: "Keymaker Delivery"
    description: >-
      The delivery desk of the same agency. Every client with a health score, every
      implementation with a state and a next step, stalls flagged before the client
      notices. Reads the handoff Sales writes on a won deal. Add the project-* library
      skills and a GitHub token for a GitHub Issues project registry.
  - repo: Abilityai/keymaker-marketing
    display_name: "Keymaker Marketing"
    description: >-
      The marketing desk of the same agency. Plans the content, counts the leads by
      channel, writes the weekly report, hands qualified inbound to Sales.
